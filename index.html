<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revista Digital</title>
    <!-- Vincula o arquivo CSS externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="revista-container">
        <!-- Título da Revista -->
        <h1 class="titulo-revista">NOME DA SUA REVISTA</h1>

        <!-- Imagem da Revista -->
        <div class="imagem-container">
            <img src="https://www.reddit.com/r/OnePiece/comments/1ltzmts/when_did_you_all_started_watching_one_piece/?tl=pt-br" alt="Capa da edição ou ilustração do artigo" class="imagem-revista">
        </div>

        <!-- Área de Texto -->
        <article class="conteudo-texto">
            <p>Escreva seu artigo ou texto principal aqui. Você pode adicionar múltiplos parágrafos dentro dessa seção para organizar melhor o conteúdo da sua revista digital.</p>
        </article>
    </div>

</body>
</html>
