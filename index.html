<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartaz Wanted - Revista Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Container do Cartaz -->
    <main class="cartaz-container">
        
        <!-- Título Principal -->
        <h1 class="titulo-principal">WANTED</h1>

        <!-- Imagem do Procurado (Substitua a URL da imagem aqui) -->
        <div class="imagem-box">
            <img class="foto-procurado" src="Screenshot_20260902-181158_Google.jpg" alt="Foto do Procurado">
        </div>

        <!-- Pequeno Texto (Subtítulo, Nome e Recompensa) -->
        <section class="conteudo-texto">
            <p class="status">DEAD OR ALIVE</p>
            <h2 class="nome-personagem">MONKEY·D·LUFFY</h2>
            <p class="recompensa">฿ 500,000,000-</p>
            <p class="rodape-marine">MARINE</p>
        </section>

    </main>

</body>
</html>
